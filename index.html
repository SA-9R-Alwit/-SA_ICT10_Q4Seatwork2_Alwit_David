<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://pyscript.net/releases/2025.7.3/core.css">
    <script type="module" src="https://pyscript.net/releases/2025.7.3/core.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>Grade 10 Emerald Classmates</title>

    <style>
        /* Midnight dark blue anmd white theme */
        body {
            background-color: #0b192c;
            color: #ffffff;
            font-family: Arial, sans-serif;
        }

        .custom-card {
            background-color: #1e3e62; 
            border: 1px solid #1e3e62;
            border-radius: 12px;
        }

        .form-control {
            background-color: #0b192c;
            border: 1px solid #3a7397;
            color: #ffffff;
        }

        .form-control:focus {
            background-color: #0b192c;
            border-color: #4cd3eb; 
            color: #ffffff;
            box-shadow: 0 0 0 0.25rem rgba(76, 211, 235, 0.25);
        }

        .form-control::placeholder {
            color: #a3c6e2;
            opacity: 0.7;
        }

        .btn-add {
            background-color: #ffffff !important;
            color: #0b192c !important;
            font-weight: bold !important;
            border: 2px solid #ffffff !important;
            transition: all 0.2s ease-in-out;
        }

        .btn-add:hover {
            background-color: #e2e8f0 !important;
            border-color: #e2e8f0 !important;
            transform: translateY(-1px);
        }

        .btn-show {
            background-color: transparent !important;
            color: #ffffff !important;
            border: 2px solid #ffffff !important;
            font-weight: bold !important;
            transition: all 0.2s ease-in-out;
        }

        .btn-show:hover {
            background-color: rgba(255, 255, 255, 0.1) !important;
            transform: translateY(-1px);
        }

        .text-accent {
            color: #a3c6e2; 
        }
    </style>
</head>

<body>


<div class="container mt-5">
    
    <!-- Title  -->
    <div class="text-center mb-4">
        <h2 class="fw-bold text-white">📘 Grade 10 Classmates System</h2>
        <p class="text-accent">Add and view your classmates easily</p>
    </div>

    <!-- Input classmates -->
    <div class="card custom-card shadow-lg p-4">
        <form onsubmit="event.preventDefault();">
            <div class="mb-3">
                <input type="text" id="classmate1" class="form-control" placeholder="Enter classmate name">
            </div>

            <div class="mb-3">
                <input type="text" id="section" class="form-control" placeholder="Enter section">
            </div>

            <div class="mb-3">
                <input type="text" id="subject" class="form-control" placeholder="Enter favorite subject">
            </div>

            <div class="d-flex gap-2">
                <button type="button" py-click="add_classmate" class="btn btn-add w-50">Add Classmate</button>
                <button type="button" py-click="show_classmates" class="btn btn-show w-50">Show List</button>
            </div>
        </form>
    </div>

    <div class="card custom-card shadow-lg mt-4 p-3">
        <h5 class="fw-bold text-white mb-2">📋 Classmate List</h5>
        <div id="output" class="text-white mt-2"></div>
    </div>

</div>

<py-script src="main.py"></py-script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
